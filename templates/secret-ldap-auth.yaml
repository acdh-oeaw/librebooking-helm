{{- if and .Values.ldap.enabled .Values.ldap.bindPassword (not .Values.ldap.existingSecretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-ldap-auth" (include "librebooking.fullname" .) }}
  labels:
    {{- include "librebooking.labels" . | nindent 4 }}
type: Opaque
stringData:
  bindpw: {{ .Values.ldap.bindPassword | quote }}
{{- end }}